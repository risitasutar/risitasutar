<g class="bob"><polygon points="380,173 394.7,181.5 380,190 365.3,181.5" fill="#fbbf24" fill-opacity=".55" stroke="#fbbf24" stroke-width="1.2"/><polygon points="365.3,181.5 380,190 380,207 365.3,198.5" fill="#f97316" fill-opacity=".55" stroke="#fbbf24" stroke-width="1.2"/><polygon points="380,190 394.7,181.5 394.7,198.5 380,207" fill="#f97316" fill-opacity=".55" stroke="#fbbf24" stroke-width="1.2"/></g>
