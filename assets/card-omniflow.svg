<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 250" width="440" height="250" role="img" aria-label="OmniFlow AI: Multi-tool agentic AI assistant">
<defs>
  <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
  <linearGradient id="sh" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <clipPath id="cl"><rect x="2" y="2" width="420" height="228" rx="18"/></clipPath>
</defs>
<style>
  .bob{animation:bob 5s ease-in-out infinite}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
  .sh{animation:sh 5s ease-in-out infinite}@keyframes sh{0%{transform:translateX(-220px) skewX(-20deg)}60%,100%{transform:translateX(560px) skewX(-20deg)}}
</style>
<rect x="14" y="16" width="420" height="228" rx="18" fill="url(#g)" opacity=".28"/>
<rect x="2" y="2" width="420" height="228" rx="18" fill="#0d1124" stroke="url(#g)" stroke-width="2"/>
<g clip-path="url(#cl)"><rect x="0" y="0" width="120" height="238" fill="url(#sh)" class="sh"/></g>
<circle cx="52" cy="50" r="26" fill="url(#g)" fill-opacity=".16" stroke="url(#g)" stroke-opacity=".6"/>
<g transform="translate(52 50)" fill="none" stroke="url(#g)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><circle cx="0" cy="0" r="5"/><circle cx="-12" cy="-9" r="3.5"/><circle cx="12" cy="-9" r="3.5"/><circle cx="0" cy="14" r="3.5"/><line x1="-4" y1="-3" x2="-9.5" y2="-7"/><line x1="4" y1="-3" x2="9.5" y2="-7"/><line x1="0" y1="5" x2="0" y2="10.5"/></g>
<g font-family="'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif">
  <text x="92" y="46" font-size="20" font-weight="800" fill="#f8fafc">OmniFlow AI</text>
  <text x="92" y="69" font-size="13.5" fill="#94a3b8">Multi-tool agentic AI assistant</text>
  <rect x="314" y="20" width="94" height="24" rx="12" fill="#052e16" stroke="#4ade80" stroke-opacity=".6"/>
  <circle cx="328" cy="32" r="4" fill="#4ade80"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle><text x="364" y="36.5" text-anchor="middle" font-size="10.5" font-weight="800" letter-spacing="1" fill="#4ade80" dx="5">LIVE DEMO</text>
  <rect x="24" y="99" width="82" height="26" rx="13" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".55"/><text x="65" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#22d3ee">29 tools</text><rect x="114.4" y="99" width="112" height="26" rx="13" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".55"/><text x="170" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#22d3ee">8 workspaces</text><rect x="234.0" y="99" width="148" height="26" rx="13" fill="#22d3ee" fill-opacity=".12" stroke="#22d3ee" stroke-opacity=".55"/><text x="308" y="116" text-anchor="middle" font-size="12.5" font-weight="700" fill="#22d3ee">Human-in-the-loop</text>
  <line x1="24" y1="176" x2="340" y2="176" stroke="#1f2a44"/>
  <text x="24" y="197" font-size="10.5" font-weight="700" letter-spacing="2" fill="#64748b">STACK</text>
  <text x="24" y="216" font-size="13" fill="#cbd5e1">Python · LangGraph · Gemini · Streamlit · SQLite</text>
</g>
<g class="bob"><polygon points="380,173 394.7,181.5 380,190 365.3,181.5" fill="#22d3ee" fill-opacity=".55" stroke="#22d3ee" stroke-width="1.2"/><polygon points="365.3,181.5 380,190 380,207 365.3,198.5" fill="#a78bfa" fill-opacity=".55" stroke="#22d3ee" stroke-width="1.2"/><polygon points="380,190 394.7,181.5 394.7,198.5 380,207" fill="#a78bfa" fill-opacity=".55" stroke="#22d3ee" stroke-width="1.2"/></g>
</svg>